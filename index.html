<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">

  <title>Frontend Mentor | QR code component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    body {
      background-color: hsl(35, 74%, 79%);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: "Outfit", sans-serif;
    }

    .qr-holder {
      width: 100%;
      max-width: 270px;
      height: auto;
      min-height: 400px;
      background-color: hsl(0, 0%, 100%);
      border-radius: 20px;
      padding: 15px;
    }

    .head {
      text-align: center;
      color: hsl(51, 79%, 35%);
      font-size: 22px;
      margin-bottom: 0;
    }

    p {
      font-size: 15px;
      text-align: center;
      color: hsl(41, 78%, 31%)
    }

    .image {
      width: 100%;
      height: auto;
      border-radius: 10px;
    }

    .attribution {
      font-size: 11px;
      text-align: center;
    }

    .attribution a {
      color: hsl(54, 45%, 44%);
    }
  </style>
</head>

<body>

  <div class="qr-holder">
    <img alt="qr" src="./images/image-qr-code.png" class="image" />
    <h3 class="head">Improve your front-end skills by building projects</h3>
    <p>Scan the QR code to visit Frontend Mentor and take your coding skills to next level</p>
  </div>
</body>

</html>
